name: Documentation build

on:
  push:
    branches: [main, 'dev_*']
  pull_request:
    branches: [main, 'dev_*']

jobs:
  build-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Standard drop-in approach that should work for most people.
      # The manual has its own Makefile (source/ -> build/), so the docs folder
      # is 'docs/manual' rather than the repository root.
      - uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: "docs/manual"
          # Absolute path: the pre-build command does not necessarily run from
          # inside the docs folder. requirements.txt pulls in the RTD theme,
          # without which the build fails on an unknown 'html_theme'.
          pre-build-command: "python -m pip install --upgrade pip && pip install -r $GITHUB_WORKSPACE/docs/manual/requirements.txt"

      # Create an artifact of the html output.
      - uses: actions/upload-artifact@v4
        with:
          name: documentation_html
          path: docs/manual/build/html/

  build-pdf:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs/manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-english \
            texlive-fonts-extra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build PDF documentation
        run: |
          make latexpdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation_pdf
          path: docs/manual/build/latex/*.pdf
