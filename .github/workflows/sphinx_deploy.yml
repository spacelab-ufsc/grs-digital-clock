name: Documentation deployment

on:
  push:
    branches: [main]

  # 'workflow_dispatch' allows manual execution of this workflow under the repository's 'Actions' tab
  workflow_dispatch:

# Required to push the built documentation to the 'gh-pages' branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Standard drop-in approach that should work for most people
      # The manual has its own Makefile (source/ -> build/), so the docs folder
      # is 'docs/manual' rather than the repository root.
      - uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: "docs/manual"
          # Absolute path: the pre-build command does not necessarily run from
          # inside the docs folder. requirements.txt pulls in the RTD theme,
          # without which the build fails on an unknown 'html_theme'.
          pre-build-command: "python -m pip install --upgrade pip && pip install -r $GITHUB_WORKSPACE/docs/manual/requirements.txt"

      # Create an artifact of the html output
      - uses: actions/upload-artifact@v4
        with:
          name: documentation_html
          path: docs/manual/build/html/

      # Publish built docs to gh-pages branch
      - name: Commit documentation changes
        run: |
          # Fall back to a fresh orphan branch the first time, when 'gh-pages'
          # does not exist yet on the remote
          git clone https://github.com/spacelab-ufsc/grs-digital-clock.git --branch gh-pages --single-branch gh-pages || {
            git clone https://github.com/spacelab-ufsc/grs-digital-clock.git gh-pages
            git -C gh-pages checkout --orphan gh-pages
            git -C gh-pages rm -rf --quiet .
          }
          cd gh-pages
          rm -rf *
          rm -f .nojekyll
          rm -f .gitignore
          rm -rf .github/
          cp -r ../docs/manual/build/html/* .
          touch .nojekyll
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update documentation" -a || true
          # The above command will fail if no changes were present, so we ignore that

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
          directory: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
